name: Build SignalsPro Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download current SignalsPro app source
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/Tumza89/SignalsPro/refs/heads/main/app.html \
            --output app/src/main/assets/app.html
          test -s app/src/main/assets/app.html
          grep -q 'id="lock"' app/src/main/assets/app.html

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SignalsPro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
